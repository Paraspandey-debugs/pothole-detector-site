services:
  - type: web
    name: pothole-detector-site
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && (pip uninstall -y opencv-python || true) && pip install --force-reinstall opencv-python-headless
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
